AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ValuePilot === VPC with public/private subnets across 2 AZs, NAT Gateways
  for outbound-only private subnet egress, security groups, and free
  Gateway VPC Endpoints for S3 and DynamoDB.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]

  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"

  # ====== Public subnets (ALB, NAT GW) ===========================================================================================================================
  PublicSubnet1Cidr:
    Type: String
    Default: "10.0.1.0/24"
  PublicSubnet2Cidr:
    Type: String
    Default: "10.0.2.0/24"

  # ====== Private subnets (ECS/EKS workloads, Lambda) ==============================================================================
  PrivateSubnet1Cidr:
    Type: String
    Default: "10.0.11.0/24"
  PrivateSubnet2Cidr:
    Type: String
    Default: "10.0.12.0/24"

Resources:

  # =================================================================================================================================================================================================================================
  # VPC + Internet Gateway
  # =================================================================================================================================================================================================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}
        - Key: Project
          Value: ValuePilot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # =================================================================================================================================================================================================================================
  # Public subnets (AZ-a, AZ-b)
  # =================================================================================================================================================================================================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-public-1
        - Key: SubnetTier
          Value: public
        - Key: !Sub "kubernetes.io/cluster/valuepilot-${Environment}"
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-public-2
        - Key: SubnetTier
          Value: public
        - Key: !Sub "kubernetes.io/cluster/valuepilot-${Environment}"
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"

  # =================================================================================================================================================================================================================================
  # Private subnets (AZ-a, AZ-b)
  # =================================================================================================================================================================================================================================

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-private-1
        - Key: SubnetTier
          Value: private
        - Key: !Sub "kubernetes.io/cluster/valuepilot-${Environment}"
          Value: shared
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-private-2
        - Key: SubnetTier
          Value: private
        - Key: !Sub "kubernetes.io/cluster/valuepilot-${Environment}"
          Value: shared
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  # =================================================================================================================================================================================================================================
  # Public route table = Internet Gateway
  # =================================================================================================================================================================================================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # =================================================================================================================================================================================================================================
  # NAT Gateways (one per AZ for HA === private subnets get outbound-only egress)
  # Cost note: ~$0.045/hr + data transfer per gateway.
  # For staging/dev, reduce to 1 gateway by pointing both private route tables
  # at NatGateway1 and deleting NatGateway2 + its EIP and route table.
  # =================================================================================================================================================================================================================================

  NatEip1:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-nat-eip-1

  NatEip2:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-nat-eip-2

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-nat-1

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-nat-2

  # =================================================================================================================================================================================================================================
  # Private route tables = NAT Gateways (outbound-only; no inbound from internet)
  # =================================================================================================================================================================================================================================

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-private-rt-1

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-private-rt-2

  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # =================================================================================================================================================================================================================================
  # Security Groups
  # =================================================================================================================================================================================================================================

  # ALB: defined bare to break circular dependency with AppSecurityGroup.
  # Cross-referencing rules are added below as separate Egress/Ingress resources.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub valuepilot-${Environment}-alb-sg
      GroupDescription: ALB - allow HTTP/HTTPS from internet; outbound to app tier only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: HTTP (redirected to HTTPS by ALB)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: HTTPS
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-alb-sg

  # App tier: defined bare; cross-referencing ingress rule added below.
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub valuepilot-${Environment}-app-sg
      GroupDescription: App tier (ECS/EKS) - inbound from ALB only; outbound via NAT
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: HTTPS outbound via NAT
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: HTTP outbound via NAT
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-app-sg

  # Cross-reference rules (added after both SGs exist to avoid circular dependency)
  AlbToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt AlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 4000
      ToPort: 4000
      DestinationSecurityGroupId: !GetAtt AppSecurityGroup.GroupId
      Description: Forward to API containers only

  AppFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt AppSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 4000
      ToPort: 4000
      SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId
      Description: API port from ALB only

  # VPC Endpoints: accepts HTTPS from within the VPC CIDR
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub valuepilot-${Environment}-vpce-sg
      GroupDescription: VPC Interface Endpoints === HTTPS from VPC CIDR only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS from within VPC
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub valuepilot-${Environment}-vpce-sg

  # =================================================================================================================================================================================================================================
  # Gateway VPC Endpoints (free === traffic to S3/DynamoDB stays off the internet
  # and doesn't consume NAT Gateway bandwidth)
  # =================================================================================================================================================================================================================================

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2
        - !Ref PublicRouteTable

  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub "valuepilot-${Environment}-vpc-id"
  VpcCidr:
    Value: !GetAtt Vpc.CidrBlock
    Export:
      Name: !Sub "valuepilot-${Environment}-vpc-cidr"

  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "valuepilot-${Environment}-public-subnet-1-id"
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "valuepilot-${Environment}-public-subnet-2-id"

  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "valuepilot-${Environment}-private-subnet-1-id"
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "valuepilot-${Environment}-private-subnet-2-id"

  AlbSecurityGroupId:
    Value: !GetAtt AlbSecurityGroup.GroupId
    Export:
      Name: !Sub "valuepilot-${Environment}-alb-sg-id"
  AppSecurityGroupId:
    Value: !GetAtt AppSecurityGroup.GroupId
    Export:
      Name: !Sub "valuepilot-${Environment}-app-sg-id"
  VpcEndpointSecurityGroupId:
    Value: !GetAtt VpcEndpointSecurityGroup.GroupId
    Export:
      Name: !Sub "valuepilot-${Environment}-vpce-sg-id"

  NatGateway1Eip:
    Value: !Ref NatEip1
    Description: Outbound NAT IP for AZ-1 === whitelist this at third-party APIs (Plaid, Stripe, etc.)
    Export:
      Name: !Sub "valuepilot-${Environment}-nat-1-eip"
  NatGateway2Eip:
    Value: !Ref NatEip2
    Description: Outbound NAT IP for AZ-2 === whitelist this at third-party APIs (Plaid, Stripe, etc.)
    Export:
      Name: !Sub "valuepilot-${Environment}-nat-2-eip"
