AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ValuePilot — AWS Secrets Manager secrets.
  NOTE: valuepilot/jwt, valuepilot/stripe, and valuepilot/stripe-webhook
  are managed by the valuepilot-payments-dev stack. This stack manages
  the remaining application secrets and the shared read policy.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
  Prefix:
    Type: String
    Default: valuepilot
    Description: Path prefix for all secret names

Resources:

  # ── Plaid API credentials ─────────────────────────────────────────────────
  PlaidSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${Prefix}/plaid
      Description: Plaid API client ID and secret
      SecretString: '{"clientId":"REPLACE_ME","secret":"REPLACE_ME"}'
      Tags:
        - Key: Project
          Value: ValuePilot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ── Google OAuth credentials ──────────────────────────────────────────────
  GoogleOAuthSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${Prefix}/google-oauth
      Description: Google OAuth 2.0 client ID and secret for Gmail email intelligence
      SecretString: '{"clientId":"REPLACE_ME","clientSecret":"REPLACE_ME"}'
      Tags:
        - Key: Project
          Value: ValuePilot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ── SMTP credentials ──────────────────────────────────────────────────────
  SmtpSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${Prefix}/smtp
      Description: SMTP credentials for invoice and transactional email delivery
      SecretString: '{"host":"REPLACE_ME","port":"587","user":"REPLACE_ME","pass":"REPLACE_ME"}'
      Tags:
        - Key: Project
          Value: ValuePilot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ── Shared read policy: covers all valuepilot/* secrets ───────────────────
  SecretsReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub valuepilot-secrets-read-${Environment}
      Description: Allows ValuePilot API task role to read all application secrets
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadAppSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/*"

Outputs:
  SecretsReadPolicyArn:
    Value: !Ref SecretsReadPolicy
    Export:
      Name: !Sub "valuepilot-${Environment}-secrets-read-policy-arn"
  PlaidSecretArn:
    Value: !Ref PlaidSecret
    Export:
      Name: !Sub "valuepilot-${Environment}-plaid-secret-arn"
  GoogleOAuthSecretArn:
    Value: !Ref GoogleOAuthSecret
    Export:
      Name: !Sub "valuepilot-${Environment}-google-oauth-secret-arn"
  SmtpSecretArn:
    Value: !Ref SmtpSecret
    Export:
      Name: !Sub "valuepilot-${Environment}-smtp-secret-arn"
