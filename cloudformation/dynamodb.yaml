AWSTemplateFormatVersion: "2010-09-09"
Description: ValuePilot — DynamoDB log tables (18 tables, all domains)

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]

Resources:

  # ── Table 1: vp-users-log ────────────────────────────────────────────────────
  UsersLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub vp-users-log-${Environment}
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: timestamp_ms
          AttributeType: N
      GlobalSecondaryIndexes:
        - IndexName: GSI1-email-time
          KeySchema:
            - AttributeName: email
              KeyType: HASH
            - AttributeName: timestamp_ms
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2-eventType-time
          KeySchema:
            - AttributeName: eventType
              KeyType: HASH
            - AttributeName: timestamp_ms
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId:
          Fn::ImportValue:
            Fn::Sub: "valuepilot-${Environment}-dynamodb-cmk-arn"
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Project
          Value: ValuePilot
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

