apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai-api
  labels:
    app: logai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logai-api
  template:
    metadata:
      labels:
        app: logai-api
    spec:
      containers:
        - name: api
          image: 803283181205.dkr.ecr.us-east-2.amazonaws.com/logai-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: JWT_SECRET
              value: "change-this-in-production"
            - name: JWT_EXPIRES_IN
              value: "7d"
            - name: ML_SERVICE_URL
              value: "http://logai-ml-service:8000"
            - name: RATE_LIMIT_WINDOW_MS
              value: "900000"
            - name: RATE_LIMIT_MAX
              value: "100"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: logai-api
spec:
  selector:
    app: logai-api
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP