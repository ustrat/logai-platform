apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai-api
  namespace: valuepilot
  labels:
    app: logai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logai-api
  template:
    metadata:
      labels:
        app: logai-api
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: api
          image: 803283181205.dkr.ecr.us-east-1.amazonaws.com/logai-api:latest
          ports:
            - containerPort: 4000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: ML_SERVICE_URL
              value: "http://logai-ml-service:8000"
            - name: RATE_LIMIT_WINDOW_MS
              value: "900000"
            - name: RATE_LIMIT_MAX
              value: "100"
            - name: COGNITO_USER_POOL_ID
              value: "us-east-1_wAtL6VDer"
            - name: COGNITO_CLIENT_ID
              value: "2ktm4qt4ka7kb3sl0r1ogdo2e8"
            - name: AWS_REGION
              value: "us-east-1"
            - name: ENTITLEMENTS_TABLE
              value: "vp-entitlements-production"
            - name: SUBSCRIPTIONS_TABLE
              value: "vp-ent-subscriptions-production"
            - name: CATALOG_TABLE
              value: "vp-catalog-production"
            - name: ENTITLEMENT_EVENT_BUS
              value: "valuepilot-entitlement-events-production"
            - name: USER_PROFILES_TABLE
              value: "vp-user-profiles-production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: logai-api
  namespace: valuepilot
spec:
  selector:
    app: logai-api
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
