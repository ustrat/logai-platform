apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai-web
  namespace: valuepilot
  labels:
    app: logai-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logai-web
  template:
    metadata:
      labels:
        app: logai-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: 803283181205.dkr.ecr.us-east-1.amazonaws.com/logai-web:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: logai-web
  namespace: valuepilot
spec:
  selector:
    app: logai-web
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
