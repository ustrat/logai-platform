apiVersion: apps/v1
kind: Deployment
metadata:
  name: logai-web
  labels:
    app: logai-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logai-web
  template:
    metadata:
      labels:
        app: logai-web
    spec:
      containers:
        - name: web
          image: 803283181205.dkr.ecr.us-east-1.amazonaws.com/logai-web:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: logai-web
spec:
  selector:
    app: logai-web
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
