apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: valuepilot
  annotations:
    # IRSA: pod tokens are exchanged for short-lived AWS credentials scoped
    # to valuepilot-production-api-sa-role. No node-level AWS credentials used.
    # Replace <ACCOUNT_ID> with your AWS account ID (803283181205).
    eks.amazonaws.com/role-arn: arn:aws:iam::803283181205:role/valuepilot-production-api-sa-role
    eks.amazonaws.com/token-expiration: "3600"
automountServiceAccountToken: true
